services:
  postgres:
    image: postgres:15-alpine
    container_name: chika-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chika
      POSTGRES_PASSWORD: chika_dev_pwd
      POSTGRES_DB: chika
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chika -d chika"]
      interval: 5s
      timeout: 5s
      retries: 5
